<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d31"><title>Airtime Arena</title><link rel="stylesheet" href="style.css"></head>
<body><audio id="soundtrack" src="sneaky-snitch.mp3" loop preload="none"></audio><main><header><div><small></small><h1>Airtime <em>Arena</em></h1></div><button id="sound" aria-pressed="true" aria-label="Mute sound">♪</button></header>
<section class="arena" aria-label="3D trampoline arena"><canvas></canvas>
<div class="top"><div><small id="cup"></small><strong id="event"></strong></div><div id="score"></div></div>
<div id="feedback" role="status"></div>
<div id="broadcast" hidden><span>● LIVE</span><strong id="shot"></strong><button id="skip">Skip</button></div>
<div id="judges" hidden aria-live="polite"><small>JUDGES’ SCORE</small><strong id="landing-score"></strong></div>
</section>
<div id="result" hidden><small></small><h2 id="medal"></h2><p id="summary"></p><button id="next">Next arena →</button><button id="replay">Try again</button></div>
<section class="controls"><div class="goal"><span id="target"></span><strong id="turns"></strong></div><div class="track"><i id="spin"></i><b id="line"></b></div><button id="action">Jump ↑</button></section>
<details id="arena-menu" hidden><summary>Arenas</summary><nav id="cups" aria-label="Arena selection"></nav></details><p id="hint">Hold to tuck · Release at the line</p><p id="rewards" hidden></p>
<p class="music-credit">♫ <a href="https://www.incompetech.com/music/royalty-free/index.html?isrc=USUAN1100772">Sneaky Snitch</a> · Kevin MacLeod · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></p></main><script src="vendor/three.min.js"></script><script type="module" src="app.mjs"></script></body></html>
